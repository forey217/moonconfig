name: Verify MoonConfig
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target js --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon test --target native --deny-warn
      - run: npm run build
      - run: node --test tests/cli.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: moonconfig-demo
          path: demo/
